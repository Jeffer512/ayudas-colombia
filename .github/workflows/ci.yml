name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ayudas
          POSTGRES_PASSWORD: ayudas
          POSTGRES_DB: ayudas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayudas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          node server/node_modules/prisma/build/index.js generate --schema server/prisma/schema.prisma
          test -f server/node_modules/.prisma/client/index.js

      - name: Tests (server + web)
        run: npm test

      - name: Lint (web)
        run: npm run lint -w web

      - name: Typecheck (web)
        run: npm run typecheck -w web

      - name: Build
        run: npm run build
