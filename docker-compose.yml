services:
  postgres:
    image: postgres:16-alpine
    container_name: proyecto-ayudas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayudas
      POSTGRES_PASSWORD: ayudas
      POSTGRES_DB: ayudas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
